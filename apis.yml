aid: apache-hive
name: Apache Hive
description: >-
  Apache Hive is a data warehouse software that facilitates reading, writing, and managing large datasets residing in
  distributed storage using SQL. It provides a SQL-like interface called HiveQL for querying data stored in Hadoop,
  along with a WebHCat REST API for job submission and metastore access.
